[build]
builder = "nixpacks"
# ⚠️ Python 3.11 is pinned in .python-version and nixpacks reads it. It is not
# cosmetic: google-genai requires >= 3.10, so a nixpacks default of 3.9 fails
# the pip resolve and takes the whole service down. That is the exact failure
# mode that kept this repo undeployed from May to August 2026.
# pip install is required and fatal. The chromium install is best-effort: it is
# only used by the competitor scraper (scraper.py imports playwright lazily and
# raises a caught error if the browser is absent), so a failed browser install
# must NOT take down the autopilot, Meta and rules endpoints with it. Dropped
# --with-deps because that apt step needs root and is the usual reason this
# build died.
buildCommand = "pip install -r requirements.txt && (playwright install chromium || echo 'chromium install skipped; competitor scraping will be unavailable until it succeeds')"

[deploy]
startCommand = "uvicorn main:app --host 0.0.0.0 --port $PORT"
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3
